[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bpc-ingestion"
version = "0.4.0"
description = "Pipeline reprodutivel de processos BPC via DataJud e Comunica PJe"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "ftfy>=6.3,<7",
    "httpx>=0.28,<1",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.6,<5"]
dev = ["pytest>=8.3,<9"]

[project.scripts]
bpc-ingestion = "bpc_ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bpc_ingestion = ["static/*.html"]
